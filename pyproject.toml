[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "chinese-jev"
version = "0.1.0"
description = "Data construction, fine-tuning, calibration and evaluation for Chinese-Jev typed decision models"
readme = "README.md"
requires-python = ">=3.9"
license = {file = "LICENSE"}
authors = [{name = "Chinese-Jev contributors"}]
dependencies = [
    "numpy>=1.24",
    "torch>=2.1",
    "transformers>=4.40",
    "safetensors>=0.4",
]

[project.optional-dependencies]
dev = ["ruff>=0.4"]

[project.scripts]
chinese-jev = "chinese_jev.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py39"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
