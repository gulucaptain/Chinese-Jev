[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "chinese-jev-data-pipeline"
version = "0.2.0"
description = "A reproducible pipeline for constructing Chinese-Jev decision datasets"
readme = "README.md"
requires-python = ">=3.9"
license = {file = "LICENSE"}
authors = [{name = "Chinese-Jev Data Pipeline contributors"}]
dependencies = []

[project.optional-dependencies]
prepare = ["transformers>=4.40", "torch>=2.1"]
parquet = ["pyarrow>=14"]
all = ["transformers>=4.40", "torch>=2.1", "pyarrow>=14"]
test = []

[project.scripts]
chinese-jev-data = "chinese_jev_data_pipeline.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
chinese_jev_data_pipeline = ["templates/basic/*"]

[tool.ruff]
target-version = "py39"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
